repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Kept in step with requirements-dev.txt: this hook ran ruff v0.9.7 while CI
  # installed whatever was newest, so the two checked different rules.
  #
  # `ruff-format` is deliberately absent. Formatting is black's job here, CI
  # gates on black, and the two do not agree -- ruff-format wanted to rewrite
  # files black considers correct, so a contributor with this hook installed
  # would have had their commits reformatted into a state CI then rejected.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      # No `files:` filter needed: the hook's default scope and CI's now agree,
      # because backend/ and albis_launcher.py were formatted and added to the
      # CI check. Before that the hook reformatted fourteen backend files under
      # any contributor who touched one of them.
      - id: black

  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint frontend
        entry: npm run lint:js --
        language: system
        files: ^frontend/app\.js$
