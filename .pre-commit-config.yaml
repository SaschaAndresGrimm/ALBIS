repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Kept in step with requirements-dev.txt: this hook ran ruff v0.9.7 while CI
  # installed whatever was newest, so the two checked different rules.
  #
  # `ruff-format` is deliberately absent. Formatting is black's job here, CI
  # gates on black, and the two do not agree -- ruff-format wanted to rewrite
  # files black considers correct, so a contributor with this hook installed
  # would have had their commits reformatted into a state CI then rejected.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        # Same scope as CI's `black --check tests scripts test_scripts`. With no
        # filter the hook also formats backend/, which CI does not check and
        # which is not currently black-clean -- so a contributor who touched one
        # backend file had fourteen of them reformatted under them at commit
        # time. Widening both to include backend/ is the better end state, but
        # it is a reformat-everything commit and belongs on its own.
        files: ^(tests|scripts|test_scripts)/

  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint frontend
        entry: npm run lint:js --
        language: system
        files: ^frontend/app\.js$
