version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      python-major:
        update-types:
          - "major"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"

  # Node dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      node-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      node-major:
        update-types:
          - "major"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "javascript"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      actions-major:
        update-types:
          - "major"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
