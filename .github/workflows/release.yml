name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_publish_validation:
        description: "Run the publish job in dry-run mode without creating a release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Release Inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '\n' < VERSION)"
          if [ "${tag_version}" != "${file_version}" ]; then
            echo "Tag/version mismatch: tag=${tag_version} VERSION=${file_version}"
            exit 1
          fi

      - name: Require Linux signing credentials for public tag releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          LINUX_GPG_PRIVATE_KEY_B64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_B64 }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
        run: |
          missing=()
          for key in LINUX_GPG_PRIVATE_KEY_B64 LINUX_GPG_PASSPHRASE LINUX_GPG_KEY_ID; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required Linux signing secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Require macOS signing and notarization credentials for public tag releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_SIGN_CERT_B64: ${{ secrets.MACOS_SIGN_CERT_B64 }}
          MACOS_SIGN_CERT_PASSWORD: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=()
          for key in MACOS_SIGN_CERT_B64 MACOS_SIGN_CERT_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required macOS signing/notarization secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Require Windows signing credentials for public tag releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WINDOWS_SIGN_CERT_B64: ${{ secrets.WINDOWS_SIGN_CERT_B64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGN_TIMESTAMP_URL }}
        run: |
          missing=()
          for key in WINDOWS_SIGN_CERT_B64 WINDOWS_SIGN_CERT_PASSWORD WINDOWS_SIGN_TIMESTAMP_URL; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required Windows signing secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm ci

      - name: Ruff
        run: ruff check backend tests scripts test_scripts

      - name: Black
        run: black --check tests scripts test_scripts

      - name: Pytest
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p pytest_cov --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=50

      - name: ESLint
        run: npm run lint:js

      - name: Vitest
        run: npm run test:js

      - name: Translation review report
        run: npm run review:i18n

  build_linux:
    name: Build Linux Artifact (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: linux
            target_arch: x64
            target: linux-x64
            expected_uname: x86_64
    env:
      ALBIS_TARGET_OS: ${{ matrix.target_os }}
      ALBIS_TARGET_ARCH: ${{ matrix.target_arch }}
      LINUX_GPG_PRIVATE_KEY_B64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_B64 }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
      LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/build_linux.sh
            scripts/package_linux_appimage.sh

      - name: Assert runner architecture
        run: |
          actual="$(uname -m)"
          if [ "$actual" != "${{ matrix.expected_uname }}" ]; then
            echo "Unexpected runner architecture: $actual (expected ${{ matrix.expected_uname }})"
            exit 1
          fi

      - name: Install appimagetool
        run: sudo bash ./scripts/install_appimagetool.sh

      - name: Build tarball package
        run: ./scripts/build_linux.sh

      - name: Build AppImage package
        run: ./scripts/package_linux_appimage.sh

      - name: Smoke test packaged binary
        run: python scripts/smoke_packaged_binary.py --binary dist/ALBIS/ALBIS --startup-timeout 60

      - name: Build Linux AppImage installer bundle
        run: |
          VERSION_INFO="$(python scripts/version_info.py --shell)"
          eval "$VERSION_INFO"
          appimage="dist/ALBIS-${VERSION}-${APPIMAGE_ARCH}.AppImage"
          if [ ! -f "$appimage" ]; then
            echo "No AppImage produced at $appimage"
            exit 1
          fi
          base="$(basename "$appimage" .AppImage)"
          bundle_dir="dist/${base}-bundle"
          rm -rf "$bundle_dir"
          mkdir -p "$bundle_dir"
          cp "$appimage" "$bundle_dir/"
          cp scripts/install_linux_appimage.sh "$bundle_dir/install_linux_appimage.sh"
          cp scripts/uninstall_linux.sh "$bundle_dir/uninstall_linux.sh"
          chmod +x "$bundle_dir/install_linux_appimage.sh" "$bundle_dir/uninstall_linux.sh"
          tar -czf "dist/${base}-appimage-bundle.tar.gz" -C "$bundle_dir" .

      - name: Verify package integrity
        run: |
          set -euo pipefail
          VERSION_INFO="$(python scripts/version_info.py --shell)"
          eval "$VERSION_INFO"
          tarball="dist/ALBIS-${TARGET}-${TAG}.tar.gz"
          appimage="dist/ALBIS-${VERSION}-${APPIMAGE_ARCH}.AppImage"
          bundle="dist/ALBIS-${VERSION}-${APPIMAGE_ARCH}-appimage-bundle.tar.gz"

          [ -f "$tarball" ] || { echo "Missing Linux tarball"; exit 1; }
          [ -f "$appimage" ] || { echo "Missing Linux AppImage"; exit 1; }
          [ -f "$bundle" ] || { echo "Missing Linux AppImage bundle"; exit 1; }

          tar -tzf "$tarball" >/dev/null
          tar -tzf "$bundle" >/dev/null
          test -x "$appimage"
          file "$appimage"

          tar -tzf "$bundle" | sed 's#^\./##' | grep -Fxq 'install_linux_appimage.sh'
          tar -tzf "$bundle" | sed 's#^\./##' | grep -Fxq 'uninstall_linux.sh'

      - name: Sign Linux artifacts
        run: |
          set -euo pipefail
          VERSION_INFO="$(python scripts/version_info.py --shell)"
          eval "$VERSION_INFO"
          tarball="dist/ALBIS-${TARGET}-${TAG}.tar.gz"
          appimage="dist/ALBIS-${VERSION}-${APPIMAGE_ARCH}.AppImage"
          bundle="dist/ALBIS-${VERSION}-${APPIMAGE_ARCH}-appimage-bundle.tar.gz"
          ./scripts/sign_linux.sh "$tarball" "$appimage" "$bundle"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            dist/ALBIS-${{ matrix.target }}-*.tar.gz
            dist/ALBIS-${{ matrix.target }}-*.tar.gz.sig
            dist/ALBIS-*.AppImage
            dist/ALBIS-*.AppImage.sig
            dist/ALBIS-*-appimage-bundle.tar.gz
            dist/ALBIS-*-appimage-bundle.tar.gz.sig

  build_windows:
    name: Build Windows Artifact (${{ matrix.target }})
    runs-on: windows-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: windows
            target_arch: x64
            target: windows-x64
            expected_arch: AMD64
    env:
      ALBIS_TARGET_OS: ${{ matrix.target_os }}
      ALBIS_TARGET_ARCH: ${{ matrix.target_arch }}
      WINDOWS_SIGN_CERT_B64: ${{ secrets.WINDOWS_SIGN_CERT_B64 }}
      WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
      WINDOWS_SIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGN_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/build_windows.ps1
            scripts/package_windows_innosetup.ps1

      - name: Assert runner architecture
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "${{ matrix.expected_arch }}") {
            throw "Unexpected runner architecture: $env:PROCESSOR_ARCHITECTURE (expected ${{ matrix.expected_arch }})"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build portable package
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Smoke test packaged binary
        shell: pwsh
        run: python .\scripts\smoke_packaged_binary.py --binary .\dist\ALBIS\ALBIS.exe --startup-timeout 60

      - name: Sign application payload
        shell: pwsh
        run: .\scripts\sign_windows.ps1 -Files @("dist\\ALBIS\\ALBIS.exe")

      - name: Rebuild portable zip
        shell: pwsh
        run: |
          $versionInfo = python .\scripts\version_info.py --json | ConvertFrom-Json
          $zip = "dist\\ALBIS-$($versionInfo.target)-$($versionInfo.tag).zip"
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }
          Compress-Archive -Path dist\ALBIS -DestinationPath $zip -Force

      - name: Build installer package
        shell: pwsh
        run: .\scripts\package_windows_innosetup.ps1

      - name: Smoke test installer-installed binary
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -File -Filter "ALBIS-Setup-${{ matrix.target }}-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Missing installer for ${{ matrix.target }}"
          }
          .\scripts\smoke_windows_installer.ps1 -InstallerPath $installer.FullName -StartupTimeout 60

      - name: Verify package integrity
        shell: pwsh
        run: |
          $portable = Get-ChildItem dist -File -Filter "ALBIS-${{ matrix.target }}-*.zip" | Select-Object -First 1
          $installer = Get-ChildItem dist -File -Filter "ALBIS-Setup-${{ matrix.target }}-*.exe" | Select-Object -First 1
          if (-not $portable) { throw "Missing portable zip" }
          if (-not $installer) { throw "Missing installer exe" }

          $extractDir = Join-Path $env:RUNNER_TEMP "albis-zip-check"
          if (Test-Path $extractDir) {
            Remove-Item $extractDir -Recurse -Force
          }
          Expand-Archive -Path $portable.FullName -DestinationPath $extractDir -Force

          $payloadExe = Join-Path $extractDir "ALBIS\ALBIS.exe"
          if (-not (Test-Path $payloadExe)) {
            throw "Portable zip does not contain ALBIS\\ALBIS.exe"
          }

          $installerSig = Get-AuthenticodeSignature $installer.FullName
          Write-Host "Installer signature status: $($installerSig.Status)"
          $payloadSig = Get-AuthenticodeSignature $payloadExe
          Write-Host "Payload signature status: $($payloadSig.Status)"

          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_CERT_B64)) {
            if ($installerSig.Status -ne 'Valid') {
              throw "Expected signed installer, got status $($installerSig.Status)"
            }
            if ($payloadSig.Status -ne 'Valid') {
              throw "Expected signed payload, got status $($payloadSig.Status)"
            }
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            dist/ALBIS-${{ matrix.target }}-*.zip
            dist/ALBIS-Setup-${{ matrix.target }}-*.exe

  build_macos:
    name: Build macOS Artifact (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target_os: macos
            target_arch: arm64
            target: macos-arm64
            expected_uname: arm64
          - runner: macos-15-intel
            target_os: macos
            target_arch: x64
            target: macos-x64
            expected_uname: x86_64
    env:
      ALBIS_TARGET_OS: ${{ matrix.target_os }}
      ALBIS_TARGET_ARCH: ${{ matrix.target_arch }}
      MACOS_SIGN_CERT_B64: ${{ secrets.MACOS_SIGN_CERT_B64 }}
      MACOS_SIGN_CERT_PASSWORD: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/build_mac.sh

      - name: Assert runner architecture
        run: |
          actual="$(uname -m)"
          if [ "$actual" != "${{ matrix.expected_uname }}" ]; then
            echo "Unexpected runner architecture: $actual (expected ${{ matrix.expected_uname }})"
            exit 1
          fi

      - name: Validate macOS signing configuration
        run: |
          set -euo pipefail
          configured=0
          missing=()
          for key in MACOS_SIGN_CERT_B64 MACOS_SIGN_CERT_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -n "${!key:-}" ]; then
              configured=$((configured + 1))
            else
              missing+=("$key")
            fi
          done
          if [ "$configured" -gt 0 ] && [ "${#missing[@]}" -gt 0 ]; then
            printf 'Incomplete macOS signing/notarization secret set. Missing: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Build package
        run: ./scripts/build_mac.sh

      - name: Smoke test packaged binary
        run: |
          binary="dist/ALBIS/ALBIS"
          if [ -x "dist/ALBIS.app/Contents/MacOS/ALBIS" ]; then
            binary="dist/ALBIS.app/Contents/MacOS/ALBIS"
          fi
          python scripts/smoke_packaged_binary.py --binary "$binary" --startup-timeout 60

      - name: Smoke test mounted DMG app
        run: |
          dmg_file="$(ls dist/ALBIS-${{ matrix.target }}-*.dmg | head -n1 || true)"
          [ -n "$dmg_file" ] || { echo "Missing macOS dmg"; exit 1; }
          ./scripts/smoke_macos_dmg.sh "$dmg_file" 60

      - name: Verify package integrity
        run: |
          set -euo pipefail
          zip_file="$(ls dist/ALBIS-${{ matrix.target }}-*.zip | head -n1 || true)"
          dmg_file="$(ls dist/ALBIS-${{ matrix.target }}-*.dmg | head -n1 || true)"
          [ -n "$zip_file" ] || { echo "Missing macOS zip"; exit 1; }
          [ -n "$dmg_file" ] || { echo "Missing macOS dmg"; exit 1; }

          unzip -tq "$zip_file" >/dev/null
          hdiutil verify "$dmg_file" >/dev/null

      - name: Verify macOS signing and notarization
        if: ${{ env.MACOS_SIGN_CERT_B64 != '' && env.MACOS_SIGN_CERT_PASSWORD != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: |
          zip_file="$(ls dist/ALBIS-${{ matrix.target }}-*.zip | head -n1)"
          dmg_file="$(ls dist/ALBIS-${{ matrix.target }}-*.dmg | head -n1)"
          ./scripts/verify_macos_distribution.sh dist/ALBIS.app "$dmg_file" "$zip_file"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            dist/ALBIS-${{ matrix.target }}-*.zip
            dist/ALBIS-${{ matrix.target }}-*.dmg

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build_linux, build_windows, build_macos]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_publish_validation == 'true')
    env:
      LINUX_GPG_PRIVATE_KEY_B64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_B64 }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: Prepare release bundle
        run: |
          mkdir -p release-dist
          find dist -maxdepth 1 -type f -exec cp {} release-dist/ \;
          cd release-dist
          sha256sum * | sort > SHA256SUMS.txt

      - name: Verify expected release assets
        env:
          REQUIRE_PUBLIC_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          ls -1 release-dist

          linux_tarball="$(find release-dist -maxdepth 1 -type f -name 'ALBIS-linux-x64-v*-*.tar.gz' ! -name '*appimage-bundle*' | sort | head -n1 || true)"
          linux_bundle="$(find release-dist -maxdepth 1 -type f -name 'ALBIS-*-x86_64-appimage-bundle.tar.gz' | sort | head -n1 || true)"
          linux_appimage="$(find release-dist -maxdepth 1 -type f -name 'ALBIS-*-x86_64.AppImage' | sort | head -n1 || true)"
          windows_zip="$(ls release-dist/ALBIS-windows-x64-v*-*.zip | head -n1 || true)"
          windows_setup="$(ls release-dist/ALBIS-Setup-windows-x64-v*-*.exe | head -n1 || true)"
          mac_arm_zip="$(ls release-dist/ALBIS-macos-arm64-v*-*.zip | head -n1 || true)"
          mac_arm_dmg="$(ls release-dist/ALBIS-macos-arm64-v*-*.dmg | head -n1 || true)"
          mac_x64_zip="$(ls release-dist/ALBIS-macos-x64-v*-*.zip | head -n1 || true)"
          mac_x64_dmg="$(ls release-dist/ALBIS-macos-x64-v*-*.dmg | head -n1 || true)"

          [ -n "$linux_tarball" ] || { echo "Missing Linux tarball"; exit 1; }
          [ -n "$linux_bundle" ] || { echo "Missing Linux AppImage bundle"; exit 1; }
          [ -n "$linux_appimage" ] || { echo "Missing Linux AppImage"; exit 1; }

          if [ "${REQUIRE_PUBLIC_SIGNING}" = "true" ] || [ -n "${LINUX_GPG_PRIVATE_KEY_B64:-}" ]; then
            [ -f "${linux_tarball}.sig" ] || { echo "Missing Linux tarball signature"; exit 1; }
            [ -f "${linux_bundle}.sig" ] || { echo "Missing Linux AppImage bundle signature"; exit 1; }
            [ -f "${linux_appimage}.sig" ] || { echo "Missing Linux AppImage signature"; exit 1; }
          fi

          [ -n "$windows_zip" ] || { echo "Missing Windows zip"; exit 1; }
          [ -n "$windows_setup" ] || { echo "Missing Windows setup exe"; exit 1; }
          [ -n "$mac_arm_zip" ] || { echo "Missing macOS arm64 zip"; exit 1; }
          [ -n "$mac_arm_dmg" ] || { echo "Missing macOS arm64 dmg"; exit 1; }
          [ -n "$mac_x64_zip" ] || { echo "Missing macOS x64 zip"; exit 1; }
          [ -n "$mac_x64_dmg" ] || { echo "Missing macOS x64 dmg"; exit 1; }
          [ -f release-dist/SHA256SUMS.txt ] || { echo "Missing SHA256SUMS.txt"; exit 1; }

      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          assets=(release-dist/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found in release-dist/"
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            gh auth status
            echo "Dry-run validation completed for ${GITHUB_REF_NAME}; release creation was skipped."
            printf '%s\n' "${assets[@]}"
            exit 0
          fi

          tag="${GITHUB_REF_NAME}"
          notes_file="release-notes/${tag}.md"

          publish_release() {
            if gh release view "$tag" >/dev/null 2>&1; then
              if [ -f "$notes_file" ]; then
                gh release edit "$tag" --notes-file "$notes_file"
              fi
              gh release upload "$tag" "${assets[@]}" --clobber
            else
              if [ -f "$notes_file" ]; then
                gh release create "$tag" "${assets[@]}" --notes-file "$notes_file" --verify-tag
              else
                gh release create "$tag" "${assets[@]}" --generate-notes --verify-tag
              fi
            fi
          }

          backoffs=(0 180 300)
          for index in "${!backoffs[@]}"; do
            attempt=$((index + 1))
            delay="${backoffs[$index]}"

            if [ "$delay" -gt 0 ]; then
              echo "Release publish attempt ${attempt} starting after ${delay}s cooldown."
              sleep "$delay"
            else
              echo "Starting release publish attempt ${attempt}."
            fi

            if publish_release; then
              echo "Release publish succeeded on attempt ${attempt}."
              exit 0
            fi

            echo "Release publish attempt ${attempt} failed."
          done

          echo "Release publish failed after 3 attempts."
          exit 1
