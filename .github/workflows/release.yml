name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Release Inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '\n' < VERSION)"
          if [ "${tag_version}" != "${file_version}" ]; then
            echo "Tag/version mismatch: tag=${tag_version} VERSION=${file_version}"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm ci

      - name: Ruff
        run: ruff check backend tests scripts test_scripts

      - name: Black
        run: black --check tests scripts test_scripts

      - name: Pytest
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p pytest_cov --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=20

      - name: ESLint
        run: npm run lint:js

      - name: Vitest
        run: npm run test:js

  build_linux:
    name: Build Linux Artifact
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/build_linux.sh

      - name: Install appimagetool
        run: |
          curl -L -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          sudo mv /tmp/appimagetool.AppImage /usr/local/bin/appimagetool.AppImage
          cat <<'EOF' | sudo tee /usr/local/bin/appimagetool >/dev/null
          #!/usr/bin/env bash
          APPIMAGE_EXTRACT_AND_RUN=1 /usr/local/bin/appimagetool.AppImage "$@"
          EOF
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Build tarball package
        run: ./scripts/build_linux.sh

      - name: Build AppImage package
        run: ./scripts/package_linux_appimage.sh

      - name: Bundle Linux helper scripts
        run: |
          cp scripts/install_linux_appimage.sh dist/install_linux_appimage.sh
          cp scripts/uninstall_linux.sh dist/uninstall_linux.sh
          chmod +x dist/install_linux_appimage.sh dist/uninstall_linux.sh

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/install_linux_appimage.sh
            dist/uninstall_linux.sh

  build_windows:
    name: Build Windows Artifact
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/build_windows.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build portable package
        run: .\scripts\build_windows.ps1

      - name: Build installer package
        run: .\scripts\package_windows_innosetup.ps1

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: |
            dist/*.zip
            dist/*.exe

  build_macos:
    name: Build macOS Artifact
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/build_mac.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Build package
        run: ./scripts/build_mac.sh

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: |
            dist/*.zip
            dist/*.dmg

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build_linux, build_windows, build_macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: Prepare release bundle
        run: |
          mkdir -p release-dist
          find dist -maxdepth 1 -type f -exec cp {} release-dist/ \;
          cd release-dist
          sha256sum * | sort > SHA256SUMS.txt

      - name: Verify expected release assets
        run: |
          ls -1 release-dist
          required_patterns=(
            "ALBIS-linux-*.tar.gz"
            "ALBIS-linux-*.AppImage"
            "install_linux_appimage.sh"
            "uninstall_linux.sh"
            "ALBIS-windows-*.zip"
            "ALBIS-Setup-windows-*.exe"
            "ALBIS-macos-*.zip"
            "ALBIS-macos-*.dmg"
            "SHA256SUMS.txt"
          )
          for pattern in "${required_patterns[@]}"; do
            if ! compgen -G "release-dist/${pattern}" >/dev/null; then
              echo "Missing expected release asset pattern: ${pattern}"
              exit 1
            fi
          done

      - name: Publish release (attempt 1)
        id: publish_release_attempt1
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: release-dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Cooldown before retry 2
        if: steps.publish_release_attempt1.outcome == 'failure'
        run: |
          echo "Release publish attempt failed; sleeping 180s before retry (possible secondary rate limit)."
          sleep 180

      - name: Publish release (attempt 2)
        id: publish_release_attempt2
        if: steps.publish_release_attempt1.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: release-dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Cooldown before retry 3
        if: steps.publish_release_attempt2.outcome == 'failure'
        run: |
          echo "Second release publish attempt failed; sleeping 300s before final retry."
          sleep 300

      - name: Publish release (attempt 3)
        if: steps.publish_release_attempt2.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
