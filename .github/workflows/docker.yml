name: Docker

on:
  push:
    branches: ["main", "dev"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      run_publish_validation:
        description: "Run the publish job in dry-run mode without pushing images"
        required: false
        default: false
        type: boolean

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker_validate:
    name: Docker Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            ALBIS_BUILD_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          load: true
          tags: albis-ci:validate
          cache-from: type=gha,scope=albis-docker-validate
          cache-to: type=gha,mode=max,scope=albis-docker-validate

      - name: Start container with mounted test data
        run: |
          docker run -d \
            --name albis-ci \
            -p 18000:8000 \
            -v "${{ github.workspace }}/testdata:/app/data:ro" \
            albis-ci:validate

      - name: Smoke test /api/health
        run: |
          set -euo pipefail

          healthy=0
          for attempt in $(seq 1 45); do
            if curl -fsS "http://localhost:18000/api/health" > /tmp/albis-health.json; then
              if python -c "import json,sys; d=json.load(open('/tmp/albis-health.json', encoding='utf-8')); sys.exit(0 if d.get('status')=='ok' else 1)"; then
                healthy=1
                break
              fi
            fi

            container_status="$(docker inspect -f '{{.State.Status}}' albis-ci 2>/dev/null || echo missing)"
            if [ "$container_status" != "running" ]; then
              echo "Container is not running (status=$container_status)"
              docker logs albis-ci || true
              exit 1
            fi

            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Health endpoint did not report status=ok"
            docker logs albis-ci || true
            exit 1
          fi

      - name: Assert the image knows which build it is
        run: |
          set -euo pipefail

          # The image has no .git and no BUILD_COMMIT file, so the commit can
          # only arrive through the ALBIS_BUILD_COMMIT build argument. Nothing
          # else fails when that wiring breaks: the container still starts and
          # still reports status=ok, it just silently stops being able to say
          # which build it is -- which is the whole point of stamping it.
          python - <<'PY'
          import json
          import re
          import sys

          with open("/tmp/albis-health.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          commit = payload.get("commit", "")
          if not re.fullmatch(r"[0-9a-f]{7}", commit):
              print(f"Image reported commit {commit!r}, expected a 7-character hex commit.")
              print("Check the ALBIS_BUILD_COMMIT build argument in this workflow and Dockerfile.")
              sys.exit(1)

          print(f"Image reports version {payload.get('version')} commit {commit}")
          PY

      - name: Smoke test /api/files returns mounted image files
        run: |
          set -euo pipefail

          curl -fsS "http://localhost:18000/api/files" > /tmp/albis-files.json
          python -c "import json,sys; d=json.load(open('/tmp/albis-files.json', encoding='utf-8')); f=d.get('files'); ok=isinstance(f,list) and len(f)>0; print(('Found %d files; first=%s' % (len(f), f[0])) if ok else ('Invalid /api/files response shape' if not isinstance(f,list) else 'No image files discovered from mounted testdata')); sys.exit(0 if ok else 1)"

      - name: Smoke test a compression-filtered frame actually decodes
        run: |
          set -euo pipefail

          # The image installs the HDF5 filter plugins that real detector data
          # needs, and a container that starts proves nothing about them: the
          # plugin libraries are only loaded when chunks are pulled in. This is
          # the one artifact whose dependency install differs from a plain
          # `pip install -r requirements.txt`, so it is the one that has to be
          # asked to decode something.
          curl -fsS -D /tmp/albis-frame.headers \
            "http://localhost:18000/api/frame?file=compressed_stack.h5&dataset=/entry/data/data&index=2" \
            -o /tmp/albis-frame.bin

          python - <<'PY'
          import re
          import sys

          headers = {}
          with open("/tmp/albis-frame.headers", encoding="utf-8", errors="replace") as handle:
              for line in handle:
                  if ":" in line:
                      name, _, value = line.partition(":")
                      headers[name.strip().lower()] = value.strip()

          dtype = headers.get("x-dtype", "")
          shape = headers.get("x-shape", "")
          if not re.fullmatch(r"[<>|]?u?i?[a-z]?\d+", dtype or ""):
              print(f"Unexpected X-Dtype {dtype!r}")
              sys.exit(1)

          dims = [int(part) for part in shape.split(",") if part.strip()]
          payload = open("/tmp/albis-frame.bin", "rb").read()
          itemsize = int(re.search(r"\d+$", dtype).group())
          expected = dims[0] * dims[1] * itemsize
          if len(payload) != expected:
              print(f"Frame is {len(payload)} bytes, expected {expected} for {shape} {dtype}")
              sys.exit(1)

          # The fixture fills frame N with N, so a filter that silently produced
          # zeros would pass a length check and fail this one.
          first = int.from_bytes(payload[:itemsize], "little")
          if first != 2:
              print(f"Decoded frame 2 starts with {first}, expected 2 -- filter plugins missing?")
              sys.exit(1)

          print(f"Decoded {shape} {dtype} frame from a compression-filtered dataset")
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker logs albis-ci || true

      - name: Cleanup container
        if: always()
        run: docker rm -f albis-ci || true

  docker_publish:
    name: Docker Publish (GHCR)
    runs-on: ubuntu-latest
    needs: docker_validate
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_publish_validation == 'true')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/albis" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata for release
        id: meta_release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Generate Docker metadata for validation
        id: meta_validation
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_publish_validation == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=node24-validation
            type=sha,prefix=sha-,format=short

      - name: Build scan image (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            ALBIS_BUILD_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          load: true
          tags: albis-scan:latest
          cache-from: type=gha,scope=albis-docker-publish
          cache-to: type=gha,mode=max,scope=albis-docker-publish

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: latest

      - name: Run Trivy vulnerability scan (HIGH,CRITICAL)
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            albis-scan:latest

      - name: Validate arm64 image build
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_publish_validation == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            ALBIS_BUILD_COMMIT=${{ github.sha }}
          platforms: linux/arm64
          push: false
          tags: albis-validate:arm64
          cache-from: type=gha,scope=albis-docker-publish

      - name: Build and push multi-arch image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            ALBIS_BUILD_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_release.outputs.tags }}
          labels: ${{ steps.meta_release.outputs.labels }}
          cache-from: type=gha,scope=albis-docker-publish
          cache-to: type=gha,mode=max,scope=albis-docker-publish

      - name: Confirm validation mode skipped publishing
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_publish_validation == 'true'
        run: echo "Dry-run validation completed; no image was pushed."
