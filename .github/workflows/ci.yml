name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:

permissions:
  contents: read

# A new push to a pull request makes the run for the old commit moot; cancel
# it rather than finish three operating systems' worth of tests nobody reads.
# Runs on main and dev always finish, so every commit there has a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      # Lint and formatting do not depend on the platform: once is enough.
      - name: Ruff
        if: runner.os == 'Linux'
        run: ruff check backend albis_launcher.py tests scripts test_scripts

      - name: Black
        if: runner.os == 'Linux'
        run: black --check backend albis_launcher.py tests scripts test_scripts

      - name: Pytest
        run: pytest -p pytest_cov -p xdist -n auto --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=77
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml

  frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend tooling
        run: npm ci

      - name: ESLint
        run: npm run lint:js

      - name: Vitest
        run: npm run test:js
