name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      run_verify:
        description: "Run quality gates before packaging"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Inputs
    if: ${{ inputs.run_verify }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm ci

      - name: Ruff
        run: ruff check backend tests scripts test_scripts

      - name: Black
        run: black --check tests scripts test_scripts

      - name: Pytest
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p pytest_cov --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=20

      - name: ESLint
        run: npm run lint:js

  build_linux:
    name: Build Linux Artifact
    if: ${{ always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/build_linux.sh

      - name: Build package
        run: ./scripts/build_linux.sh

      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + | sort > SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux-${{ github.run_id }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/SHA256SUMS.txt
          retention-days: 14

  build_windows:
    name: Build Windows Artifact
    if: ${{ always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/build_windows.ps1

      - name: Build package
        run: .\scripts\build_windows.ps1

      - name: Generate checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $h = Get-FileHash $_.FullName -Algorithm SHA256
              "{0}  {1}" -f $h.Hash.ToLowerInvariant(), $_.Name
            }
          Set-Content -Path dist\SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          retention-days: 14

  build_macos:
    name: Build macOS Artifact
    if: ${{ always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/build_mac.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Build package
        run: ./scripts/build_mac.sh

      - name: Generate checksums
        run: |
          cd dist
          for f in *; do
            if [ -f "$f" ] && [ "$f" != "SHA256SUMS.txt" ]; then
              shasum -a 256 "$f"
            fi
          done | sort > SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
          retention-days: 14
