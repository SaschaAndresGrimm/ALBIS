[project]
name = "albis"
version = "0.15.0"
description = "ALBIS — a local, browser-based image viewer for synchrotron/DECTRIS detector data (HDF5, TIFF, CBF, EDF)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Sascha Grimm" }]
keywords = [
  "dectris",
  "image-viewer",
  "hdf5",
  "detector",
  "albula",
  "eiger",
  "pilatus",
  "jungfrau",
  "scientific-imaging",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]

# Runtime dependencies are pinned in backend/requirements.txt. ALBIS is
# distributed as prebuilt desktop binaries (PyInstaller) and Docker images
# rather than as a pip-installable package, so they are not duplicated here.

[project.urls]
Homepage = "https://github.com/SaschaAndresGrimm/ALBIS"
Repository = "https://github.com/SaschaAndresGrimm/ALBIS.git"
Issues = "https://github.com/SaschaAndresGrimm/ALBIS/issues"
Changelog = "https://github.com/SaschaAndresGrimm/ALBIS/blob/main/CHANGELOG.md"

[tool.black]
line-length = 100
target-version = ["py313"]
include = "\\.pyi?$"
extend-exclude = "^(dist|build|data|logs)/"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["dist", "build", "data", "logs"]
[tool.ruff.lint]
select = [
  "F",    # Pyflakes
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "I",    # isort (import sorting)
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
]
ignore = [
  "E501",  # line too long (handled by black)
  "SIM115",  # use context manager for opening files (can break in some cases)
  "SIM118",  # use .keys() removal (stylistic, not always clearer)
  "N802",  # function name should be lowercase (some existing names)
  "N806",  # variable should be lowercase (some existing names)
  "N815",  # variable in class scope mixedCase (used for JSON contracts)
  "B008",  # do not perform function calls in argument defaults (FastAPI)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Warnings are errors so a deprecation in a dependency surfaces on the commit
# that introduces it rather than on the release that removes the feature.
# Each ignore below is third-party and out of our hands; ALBIS's own code
# must stay warning-clean.
filterwarnings = [
  "error",
  # starlette.testclient still imports httpx and warns at import time; nothing
  # we call chooses that. Note the category subclasses UserWarning, not
  # DeprecationWarning, so it has to be named in full.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
  # urllib closes its socket during GC when a request fails before returning a
  # handle, so the moment is not deterministic and no ALBIS code owns it. Keep
  # this narrow: it is the only non-deterministic category, and dropping it
  # turns tests/test_simplon_probe.py into an intermittent failure.
  "ignore::ResourceWarning",
]
